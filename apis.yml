name: Pickle Robot
description: 'Pickle Robot builds Physical AI systems for supply chain automation,
  best known for autonomous truck- and container-unloading robots that handle non-palletized,
  floor-loaded freight. Its Dill Autonomy Engine (DAE) pairs classical optimal control
  with generative AI and foundation models, driving an industrial arm with vision,
  LiDAR, and an air-suction gripper to unload 400-1,500 cases per hour. Founded in
  2018 and headquartered in the Boston, Massachusetts area, the company deploys into
  existing warehouses in days with no WMS integration and counts UPS among its customers.
  Pickle Robot exposes no public developer API; this profile captures its identity,
  domain-security posture, and public web properties in the API Evangelist network.'
